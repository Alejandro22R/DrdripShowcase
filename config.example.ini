; DrDrip Vitrina. Copia este archivo como config.ini y cambia lo que necesites.
; Las líneas que empiezan con ; son comentarios.

; Puerto del servidor. Las pantallas usan http://IP-DEL-PC:3000/1
port = 3000

; Carpeta de datos (base de datos, fotos y respaldos).
data_dir = data

; Anunciar el nombre drdrip.local en la red (1 = sí, 0 = no).
mdns = 1
mdns_name = drdrip
