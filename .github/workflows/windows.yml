name: Windows build

# Builds DrDripVitrina.exe on a real Windows machine, runs the test suite
# there and checks that the program installs and runs as a Windows service.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:windows
      - name: Install as a service and check it works
        shell: pwsh
        run: ./scripts/windows/smoke-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DrDripVitrina-windows
          path: release/
          if-no-files-found: error
